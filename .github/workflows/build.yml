name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Portable CI builds; cache CPM downloads across jobs.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
    steps:
      - uses: actions/checkout@v7

      - name: Check CPU Info (Linux)
        run: |
          lscpu
          cat /proc/cpuinfo | grep flags | head -n 1
          cat /proc/cpuinfo | grep "cpu MHz" | head -n 1

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            cmake \
            ninja-build \
            libhdf5-dev \
            libfftw3-dev \
            libomp-dev \
            catch2 \
            gcc-14 \
            g++-14 \
            clang-18

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/sigprocDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSIG_BUILD_TESTING=ON \
            -DSIG_ENABLE_NATIVE_ARCH=OFF \
            -DSIG_USE_SYSTEM_DEPS=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            cmake \
            ninja-build \
            libhdf5-dev \
            libfftw3-dev \
            libomp-dev \
            catch2 \
            gcc-14 \
            g++-14

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/sigprocDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure CMake
        env:
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSIG_BUILD_TESTING=ON \
            -DSIG_USE_SYSTEM_DEPS=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            cmake \
            ninja-build \
            libhdf5-dev \
            libfftw3-dev \
            libomp-dev \
            catch2 \
            gcc-14 \
            g++-14 \
            gcovr

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/sigprocDependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Configure CMake
        env:
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSIG_BUILD_TESTING=ON \
            -DSIG_ENABLE_COVERAGE=ON \
            -DSIG_USE_SYSTEM_DEPS=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Coverage report
        run: |
          gcovr --xml build/coverage.xml --html build/coverage.html \
            -r . --filter include/ --filter lib/ --filter applications/ \
            --exclude-directories build

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/coverage.xml
            build/coverage.html
